[package]
name    = "zinnias-ciao-ssr"
version.workspace       = true
edition.workspace       = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

# RFC-080 §10 / Handoff 054 §3: the local fake issuer (its HTTP routes, and
# the namespace-verification-requirements resolver's branch for
# `idns_local_fake`) exists only when this feature is enabled. Off by
# default — `bun run build` (production, staging, and every one of the ten
# pre-existing smokes) never passes it, so a production artifact is
# structurally incapable of authenticating against the fake issuer: the
# code and its string literals are absent from the compiled wasm, not
# merely unreachable at runtime. Only the new identity smoke's own,
# separately-built artifact enables it.
[features]
dev_fake_issuer = []

# Workers target is wasm32-unknown-unknown; wrangler/worker-build drives this.
[lib]
crate-type              = ["cdylib"]

[dependencies]
zinnias-ciao-domain         = { workspace = true }
zinnias-ciao-contracts      = { workspace = true }

worker                      = { workspace = true }

serde                       = { workspace = true }
serde_json                  = { workspace = true }
thiserror                   = { workspace = true }
time                        = { workspace = true }
hmac                        = { workspace = true }
sha2                        = { workspace = true }
hex                         = { workspace = true }
base64                      = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
codlet                      = { workspace = true }
getrandom                   = { workspace = true }  # crypto.rs random_token + generate_request_id
# Required directly (not only transitively via `worker`) for the
# `#[durable_object]` macro's generated glue to resolve (RFC-078).
wasm-bindgen                = "0.2"

# getrandom needed directly in admin/members.rs non-wasm fallback path
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom                   = { workspace = true }

[dev-dependencies]
# SSR worker tests run via `cargo test` in native mode for handler logic;
# wasm integration tests are handled by wrangler/vitest.
